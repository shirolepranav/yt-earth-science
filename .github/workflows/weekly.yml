# =============================================================================
# The Monday nudge.
#
# Everything else in this pipeline is driven by you sending a message. This is
# the one thing that starts on its own: every Monday morning it proposes ten
# topics and sends them to Telegram, so the week's video begins without you
# having to remember.
#
# From there it's the same conversation as always - tap a number and go.
# =============================================================================
name: Weekly topics

on:
  schedule:
    # 06:00 UTC every Monday. Times here are always UTC - adjust for your zone.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Shares a lane with the chat workflow so the Monday job can't collide with a
# build you started by hand over the weekend.
concurrency:
  group: chat
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Propose ten topics and send them
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python tools/chat_job.py --intent new | tee topics-output.txt
          grep '^RUN_ID=' topics-output.txt >> "$GITHUB_ENV"

      - if: always()
        run: bash .github/scripts/commit-runs.sh "Topics for run ${RUN_ID:-unknown}"

      - name: Tell me if it broke
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from pipeline import chat, assistant; \
            chat.failed('Monday topics', 'The topic engine stopped.', assistant.log_url())"

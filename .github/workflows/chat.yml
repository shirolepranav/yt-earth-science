# =============================================================================
# The whole pipeline, driven from Telegram.
#
# Every message you send arrives here as a `repository_dispatch` event, posted
# by the Cloudflare Worker in bot/. The first job works out what you meant and
# answers anything quick on the spot. Anything slow gets its own job below,
# with its own toolchain and timeout, so a 90-minute build never holds up a
# one-line reply.
#
# You can also run this by hand from the Actions tab (workflow_dispatch) with a
# message typed in - handy for testing without a phone.
# =============================================================================
name: Chat

on:
  repository_dispatch:
    types: [chat]
  workflow_dispatch:
    inputs:
      text:
        description: "The message to process, as if you'd sent it on Telegram"
        required: true
        default: "status"

permissions:
  contents: write
  actions: read    # to find the render segments an earlier attempt left behind

# One conversation at a time. Two jobs writing runs/ at once would fight when
# they commit. `cancel-in-progress: false` means a new message queues behind
# the current job rather than killing it mid-render.
concurrency:
  group: chat
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  # ---------------------------------------------------------------------------
  # Work out what you meant. Fast intents are answered here and go no further.
  # ---------------------------------------------------------------------------
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      intent: ${{ steps.route.outputs.intent }}
      args: ${{ steps.route.outputs.args }}
      run_id: ${{ steps.route.outputs.run_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately not requirements.txt: faster-whisper and friends are a
      # ~200 MB install, and answering "status" shouldn't wait for them.
      - name: Install the light dependencies
        run: |
          pip install requests python-dotenv \
            google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Route the message
        id: route
        env:
          MESSAGE: ${{ github.event.client_payload.text || inputs.text }}
        run: python -m pipeline.assistant --text "$MESSAGE"

      - name: Save anything the fast handlers changed
        if: always()
        run: bash .github/scripts/commit-runs.sh "Chat - ${{ steps.route.outputs.intent }}"

      # `if: failure()` is NOT enough here. A job killed by timeout-minutes is
      # CANCELLED, not failed, so failure() skips - which is how a three-hour
      # build died in total silence. Testing the step's own outcome catches
      # both, and `always()` is what lets this step run at all after a cancel.
      - name: Tell me if it broke
        if: always() && steps.route.outcome != 'success'
        run: |
          python -c "from pipeline import chat, assistant; \
            chat.failed('Reading your message', 'The router stopped.', assistant.log_url())"

  # ---------------------------------------------------------------------------
  # "new video" -> propose ten topics                                   Gate 1
  # ---------------------------------------------------------------------------
  topics:
    needs: route
    if: needs.route.outputs.intent == 'new'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Propose topics
        id: topics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python tools/chat_job.py --intent new | tee topics-output.txt
          grep '^RUN_ID=' topics-output.txt >> "$GITHUB_ENV"

      - if: always()
        run: bash .github/scripts/commit-runs.sh "Topics for run ${RUN_ID:-unknown}"

      - name: Tell me if it broke
        if: always() && steps.topics.outcome != 'success'
        run: |
          python -c "from pipeline import chat, assistant; \
            chat.failed('Topics', 'The topic engine stopped.', assistant.log_url())"

  # ---------------------------------------------------------------------------
  # a number -> research and write      |  words -> revise the script    Gate 2
  # ---------------------------------------------------------------------------
  write:
    needs: route
    if: contains(fromJSON('["pick","edit_script","replace_script"]'), needs.route.outputs.intent)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # The router's output goes through the environment, never straight into
      # the command line: an edit instruction like "the opening's flat" has an
      # apostrophe in it, which would break out of a quoted shell argument.
      - name: Research, write or revise
        id: write
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          INTENT: ${{ needs.route.outputs.intent }}
          ARGS: ${{ needs.route.outputs.args }}
          RUN_ID: ${{ needs.route.outputs.run_id }}
        run: python tools/chat_job.py --intent "$INTENT" --args "$ARGS" --run "$RUN_ID"

      - if: always()
        run: bash .github/scripts/commit-runs.sh "Script for run ${{ needs.route.outputs.run_id }}"

      - name: Tell me if it broke
        if: always() && steps.write.outcome != 'success'
        run: |
          python -c "from pipeline import chat, assistant; \
            chat.failed('Writing', 'The script chain stopped.', assistant.log_url())"

  # ---------------------------------------------------------------------------
  # "approve" -> build it and upload it privately for review            Gate 3
  #
  # The slow one. Budget 30-180 minutes, most of it video generation and the
  # three.js render.
  # ---------------------------------------------------------------------------
  build:
    needs: route
    if: contains(fromJSON('["approve_script","redo"]'), needs.route.outputs.intent)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package.json

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          # ffmpeg does the audio mixing and the stock-clip frame grabs.
          # The rest are the shared libraries Chrome needs to run headless.
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libgbm-dev libatk-bridge2.0-0 libpango-1.0-0 libcairo2

      - run: pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
        working-directory: remotion

      # Pick up segments a previous attempt finished before it was stopped.
      # download-artifact only reaches the current run, so this asks the API
      # for the newest artifact of that name across runs. Segment filenames
      # carry a hash of the shot list, so segments from a since-changed video
      # simply never match and are ignored.
      - name: Restore render segments from an earlier attempt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.route.outputs.run_id }}
        run: |
          set -uo pipefail
          url=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=segments-$RUN_ID&per_page=1" \
            | python -c "import json,sys; a=json.load(sys.stdin).get('artifacts') or []; \
                print(a[0]['archive_download_url'] if a and not a[0]['expired'] else '')")
          if [ -z "$url" ]; then
            echo "No earlier segments for $RUN_ID - rendering from the start."
            exit 0
          fi
          mkdir -p "runs/$RUN_ID/output/parts"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$url" -o /tmp/segments.zip
          unzip -q -o /tmp/segments.zip -d "runs/$RUN_ID/output/parts"
          echo "Restored $(find "runs/$RUN_ID/output/parts" -name '*.mp4' | wc -l) segment(s)."

      - name: Build the video
        id: build
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          # No GPU on the runner: software WebGL for the three.js charts/stills.
          REMOTION_GL: swangle
          INTENT: ${{ needs.route.outputs.intent }}
          ARGS: ${{ needs.route.outputs.args }}
          RUN_ID: ${{ needs.route.outputs.run_id }}
        run: |
          # render.py defaults to 2, which suited the old 2-core runners.
          # Public-repo runners have 4 vCPUs, and the render is the longest
          # thing here by far, so use whatever the machine actually has.
          export REMOTION_CONCURRENCY="$(nproc)"
          echo "Rendering with concurrency $REMOTION_CONCURRENCY"
          python tools/chat_job.py --intent "$INTENT" --args "$ARGS" --run "$RUN_ID"

      # The render is done in 2-minute segments, and a finished segment is
      # never re-rendered - but only if it's still on disk. Every job gets a
      # fresh container, so without this the segments are lost and a killed
      # render starts again from zero. `always()` matters: a timeout cancels
      # the job, and post-steps are skipped on cancel while always() steps run.
      - name: Keep the finished render segments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segments-${{ needs.route.outputs.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: runs/${{ needs.route.outputs.run_id }}/output/parts

      # A backup copy of the deliverables, in case you'd rather upload by hand
      # or the YouTube upload was skipped.
      - name: Keep the files for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ needs.route.outputs.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            runs/${{ needs.route.outputs.run_id }}/output/video.mp4
            runs/${{ needs.route.outputs.run_id }}/output/thumbnail*.jpg
            runs/${{ needs.route.outputs.run_id }}/output/subtitles.srt
            runs/${{ needs.route.outputs.run_id }}/output/UPLOAD.md
            runs/${{ needs.route.outputs.run_id }}/script.txt

      - if: always()
        run: bash .github/scripts/commit-runs.sh "Built run ${{ needs.route.outputs.run_id }}"

      - name: Tell me if it broke
        if: always() && steps.build.outcome != 'success'
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          if [ "$OUTCOME" = "cancelled" ]; then
            export REASON="The build hit the 350-minute limit and was stopped. Finished render segments were kept, so replying retry resumes from where it stopped rather than starting over."
          else
            export REASON="A build stage stopped."
          fi
          python -c "import os; from pipeline import chat, assistant; \
            chat.failed('Build', os.environ['REASON'], assistant.log_url())"

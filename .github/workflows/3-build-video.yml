# =============================================================================
# STEP 3 of 3 - Build the video.
#
# Fires when you reply "approve" to a Gate 2 issue.
# Narrates, times every word, storyboards the shots, fetches stock, generates
# the AI visuals, renders with Remotion, and attaches the MP4 to the issue.
#
# This is the slow one: budget 30-90 minutes.
# =============================================================================
name: 3 - Build the video

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    if: >
      contains(join(github.event.issue.labels.*.name, ','), 'gate-2') &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, 'approve')

    steps:
      - name: Work out which run this is
        id: meta
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          RUN_ID=$(echo "$TITLE" | sed -n 's/.*(run \(.*\))/\1/p')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: React so you know it started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1',
            });

      # -- Toolchain ---------------------------------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package.json

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          # ffmpeg does the audio mixing and the stock-clip frame grabs.
          # The rest are the shared libraries Chrome needs to run headless.
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libgbm-dev libatk-bridge2.0-0 libpango-1.0-0 libcairo2

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund

      # -- Apply your edits, if you pasted a corrected script -----------------
      - name: Apply the edited script
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          printf '%s' "$COMMENT" > comment.txt
          python tools/apply_edit.py --run "${{ steps.meta.outputs.run_id }}" --comment-file comment.txt

      # -- The actual build --------------------------------------------------
      - name: Build the video
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          # No GPU on the runner: software WebGL for the three.js charts/stills.
          REMOTION_GL: swangle
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m pipeline.run build --run "${{ steps.meta.outputs.run_id }}"

      # -- Deliver -----------------------------------------------------------
      - name: Upload the video and thumbnail
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.meta.outputs.run_id }}
          retention-days: 30
          path: |
            runs/${{ steps.meta.outputs.run_id }}/output/video.mp4
            runs/${{ steps.meta.outputs.run_id }}/output/thumbnail*.jpg
            runs/${{ steps.meta.outputs.run_id }}/metadata.json
            runs/${{ steps.meta.outputs.run_id }}/output/description.txt
            runs/${{ steps.meta.outputs.run_id }}/script.txt

      - name: Save the run folder
        run: |
          git config user.name "deepearth-bot"
          git config user.email "actions@github.com"
          git add runs/
          git commit -m "Built run ${{ steps.meta.outputs.run_id }}" || echo "nothing to commit"
          git pull --rebase || true
          git push

      - name: Post the download link and close the issue
        uses: actions/github-script@v7
        with:
          script: |
            const runId = '${{ steps.meta.outputs.run_id }}';
            const url = '${{ steps.artifact.outputs.artifact-url }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## Video ready',
                '',
                `**Run:** \`${runId}\``,
                `**Download:** ${url}`,
                '',
                'The download contains the MP4, the thumbnail, and the title/description/tags.',
                '',
                'Before you publish, do the two-minute check:',
                '- Watch the first 30 seconds. Does the hook land?',
                '- Scrub to 3:00, 6:00 and 9:00 and listen for the voice shifting at the chunk joins.',
                '- Glance at the stock footage. Anything tonally wrong, even if it technically matches?',
                '',
                'Then upload it from the YouTube app, set the thumbnail, and tick the ' +
                '"altered or synthetic content" box.',
              ].join('\n'),
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });

      - name: Report a failure into the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `The build failed. [Open the log](${url}) to see which stage.`,
                '',
                'Reply `approve` again to retry. Stages that already finished are ' +
                'skipped, so a retry picks up where it stopped rather than starting over.',
              ].join('\n'),
            });
